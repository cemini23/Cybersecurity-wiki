name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wiki-lint:
    name: Wiki lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: K303/K298 deny + K312 loop state + dual-ID restore
        run: |
          python3 scripts/restore_cybersec_dual_id.py --check
          python3 scripts/test_k303_k298_runtime.py
          python3 scripts/test_k312_loop_state.py
          python3 scripts/test_k314_enforcement_precheck.py
          python3 scripts/test_k316_cua_ipi_precheck.py
          python3 scripts/test_k317_evoskill_pipeline_precheck.py
          python3 scripts/test_k320_evoflint_redteam_precheck.py
          python3 scripts/test_k321_guardrail_construct_validity_precheck.py
          python3 scripts/test_k322_firmware_rehost_precheck.py
          python3 scripts/test_k323_codepoisonrag_precheck.py
          python3 scripts/test_k324_safeevolve_precheck.py
          python3 scripts/test_k327_agentic_redteam_precheck.py
          python3 scripts/test_k328_rag_safety_bench_precheck.py
          python3 scripts/test_k331_privescalate_precheck.py
          python3 scripts/test_k341_secure_pentest_agent_precheck.py
          python3 scripts/test_k347_asleval_precheck.py
          python3 scripts/test_k348_auto_mode_redteam_precheck.py
          python3 scripts/test_k352_pir_sandbagging_precheck.py
          python3 scripts/test_k358_rrsi_harness_precheck.py
          python3 scripts/test_k359_covert_agentic_comm_precheck.py
          python3 scripts/test_k361_rouxii_honeypot_precheck.py
          python3 scripts/test_k365_ble_reid_lab_precheck.py
          python3 scripts/test_k371_instrumental_monitor_evasion_precheck.py
          python3 scripts/test_k373_agent_trace_tampering_precheck.py
          python3 scripts/test_federation_helper_scripts.py

      - name: wiki_lint (strict local links + bidirectional)
        run: |
          set -o pipefail
          python3 scripts/wiki_lint.py --fail-on-dangling --fail-on-bidirectional | tee lint-output.txt

      - name: Post lint summary
        if: always()
        run: |
          {
            echo "## Wiki lint"
            echo ""
            echo "Gates: \`--fail-on-bidirectional\`, \`--fail-on-dangling\` (local only; cross-wiki aliases ignored on CI)."
            echo ""
            echo '```'
            cat lint-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: wiki_gap_detect (informational)
        if: always()
        run: python3 scripts/wiki_gap_detect.py || true
