loop:
  recency_window_days: 14
  max_results_per_query: 3
fetch:
  enabled: true
  max_downloads: 5
  fetch_likely: false
  max_results_per_paper_query: 3
arxiv_fallback:
  enabled: true
  request_interval_seconds: 3
  max_terms_per_query: 4
exa:
  news_enabled: false
  paper_mode: arxiv-only
  include_domains:
  - arxiv.org
  search_type: auto
active_topics:
- Offensive OSINT — recon tradecraft, attack-surface mapping, breach intel
- MCP red-team skills — agent tooling, skill supply-chain, Claude Code offensive modules
- CVE feeds — EPSS/KEV enrichment, vuln triage, responsible disclosure
- Wireless — WPA enterprise, evil twin, BLE/Zigbee pentest tradecraft
paper_queries:
- cluster: offensive-security-paper
  query: research paper penetration testing red team adversary emulation MITRE ATT&CK
  category: research paper
  arxiv_query: (all:"offensive security" OR all:pentest OR all:"red team") AND (all:attack OR all:exploit
    OR all:adversarial)
- cluster: llm-security-paper
  query: research paper LLM agent security prompt injection MCP tool poisoning
  category: research paper
  arxiv_query: (all:LLM OR all:"large language") AND (all:jailbreak OR all:prompt OR all:security OR all:guardrail) ANDNOT (all:"remote sensing" OR all:segmentation OR all:SIDPP OR all:"output-weight")
- cluster: wireless-security-paper
  query: research paper Wi-Fi WPA3 Bluetooth BLE wireless penetration testing
  category: research paper
  # Prefer RF pentest surfaces; bare "wireless"+security pulls ISAC/localization sensing papers (OOD 14775/14778/14938).
  arxiv_query: (all:WiFi OR all:"Wi-Fi" OR all:802.11 OR all:WPA OR all:WPA2 OR all:WPA3 OR all:Bluetooth OR all:BLE OR all:"evil twin" OR all:deauth) AND (all:attack OR all:pentest OR all:exploit OR all:security) ANDNOT (all:ISAC OR all:localization OR all:OFDM OR all:"range-Doppler" OR all:"point cloud" OR all:MLO OR all:"multi-link" OR all:EDCA OR all:goodput OR all:MADDPG)
queries:
- cluster: cve-threat-intel
  query: '"CVE" OR "CISA KEV" OR EPSS vulnerability disclosure exploit PoC'
  category: news
- cluster: offensive-osint
  query: '"OSINT" pentest recon subdomain enumeration threat actor infrastructure'
  category: news
- cluster: mcp-agent-security
  query: '"MCP server" OR "Claude Code skill" OR agent red team security audit'
  category: news
- cluster: wireless-pentest
  query: '"Wi-Fi pentest" OR WPA3 OR "evil twin" OR BLE security assessment'
  category: news
monokern_pipeline:
  enabled: true
  cadence: weekly
  default_deliverable: none
  source_modules:
  - yt-dlp
  - inbox_pdf
  - web_url
  skill_notes: Use notebooklm-osint-bridge + skill-creator; laptop auth only.
social:
  manual_pass:
  - tool: opencli-reader
    prompt: HackerNews / arXiv frontpage for offensive security + agent tooling last 24h
output:
  path_template: wiki/sweeps/{date}-daily.md
